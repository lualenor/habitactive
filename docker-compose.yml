services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habitactive
      POSTGRES_PASSWORD: habitactive
      POSTGRES_DB: habitactive
    ports:
      - "5432:5432"
    volumes:
      - habitactive-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitactive -d habitactive"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://habitactive:habitactive@db:5432/habitactive?schema=public
      NEXTAUTH_SECRET: cambia-este-secreto-en-produccion-32-bytes
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  habitactive-db:
